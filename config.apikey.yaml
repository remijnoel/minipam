# MiniPAM Configuration - API Key Authentication
# This configuration enables API key authentication for MiniPAM

# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

# Storage configuration
storage:
  type: "file"
  file:
    path: "/app/data/cidrs.json"

# Debug mode
debug: false

# CORS configuration
cors:
  enabled: true
  origins:
    - "*"

# Web UI configuration
ui:
  enabled: true
  path: "webui/dist"

# Authentication configuration
auth:
  backend: "apikey"
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production"
    algorithm: "HS256"
    expiry_hours: 8

  # API key configuration
  api_keys:
    # Format: username: key:role
    admin: "sk-minipam-admin-12345:readwrite"
    viewer: "sk-minipam-viewer-67890:readonly"
    service: "sk-minipam-service-99999:readwrite"
