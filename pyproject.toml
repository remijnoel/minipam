[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "minipam"
dynamic = ["version"]
description = "Minimalistic IP Address Management - Production-grade CIDR block management system"
readme = "README.md"
authors = [
  { name = "Remi Noel", email = "remi@rnoel.net" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ipam", "cidr", "networking", "ip", "address", "management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0",
  "PyJWT[crypto]>=2.8.0",
  "click>=8.1.0",
  "httpx>=0.24.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
  "mypy>=1.5.0",
  "httpx>=0.24.0",
  "types-PyYAML",
]
test = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/remijnoel/minipam"
Documentation = "https://github.com/remijnoel/minipam/docs"
Repository = "https://github.com/remijnoel/minipam.git"
Issues = "https://github.com/remijnoel/minipam/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minipam.ui" = ["dist/**/*"]

[project.scripts]
minipam = "minipam.cli:main"

[tool.setuptools_scm]


