# MiniPAM Configuration - Azure Entra ID Authentication
# This configuration enables Azure Entra ID (OIDC) authentication for MiniPAM

# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

# Storage configuration
storage:
  type: "file"
  file:
    path: "/app/data/cidrs.json"

# Debug mode
debug: false

# CORS configuration
cors:
  enabled: true
  origins:
    - "*"

# Web UI configuration
ui:
  enabled: true
  path: "webui/dist"

# Authentication configuration
auth:
  backend: "oidc"
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production"
    algorithm: "HS256"
    expiry_hours: 8

  # Azure Entra ID OIDC configuration
  oidc:
    # These values will be overridden by environment variables from .env file:
    # MINIPAM_OIDC_CLIENT_ID, MINIPAM_OIDC_CLIENT_SECRET, MINIPAM_OIDC_ISSUER_URL
    client_id: ""
    client_secret: ""
    issuer_url: ""
    redirect_uri: "http://localhost:8000/auth/callback/oidc"
    scope: "openid profile email"

    # Role mapping configuration
    role_claim: "groups"
    role_mapping: "minipam-admins:readwrite,minipam-users:readonly"
    default_role: "readonly"
