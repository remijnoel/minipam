# MiniPAM Docker Configuration
# This configuration is optimized for Docker deployment

# Server configuration
server:
  host: "0.0.0.0" # Listen on all interfaces
  port: 8000
  log_level: "info"

# Storage configuration
storage:
  type: "file"
  file:
    path: "/app/data/cidrs.json" # Persistent storage location

# Production settings
debug: false

# CORS configuration
cors:
  enabled: true
  origins:
    - "*"
  # For production, specify your allowed origins:
  # origins:
  #   - "https://yourdomain.com"
  #   - "https://ipam.yourdomain.com"

# Web UI configuration
ui:
  enabled: true
  path: "webui/dist"
