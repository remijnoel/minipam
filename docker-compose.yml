# MiniPAM Docker Compose Configuration
# 
# This configuration runs MiniPAM with configurable authentication.
# Use MINIPAM_CONFIG_FILE environment variable to specify which config to load.
# 
# Available configurations:
# - config.apikey.yaml: API key authentication (default)
# - config.azure.yaml: Azure Entra ID (OIDC) authentication
#
# Usage:
# 1. API Key auth: docker-compose up -d
# 2. Azure auth: MINIPAM_CONFIG_FILE=config.azure.yaml docker-compose up -d
#
# Or create a .env file:
# MINIPAM_CONFIG_FILE=config.azure.yaml
#
# Security Notes:
# - Change the JWT secret and API keys before production use
# - Use environment variable files (.env) for sensitive values
# - Consider using Docker secrets for production deployments

services:
  minipam:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for persistent storage
      - minipam-data:/app/data
      # Mount config files
      - ./config.apikey.yaml:/app/config.apikey.yaml:ro
      - ./config.azure.yaml:/app/config.azure.yaml:ro
    environment:
      # Core application settings
      - MINIPAM_STORAGE_TYPE=file
      - MINIPAM_STORAGE_FILE_PATH=/app/data/cidrs.json
      - MINIPAM_SERVER_HOST=0.0.0.0
      - MINIPAM_SERVER_PORT=8000
      - MINIPAM_SERVER_LOG_LEVEL=info
      
      # Config file selection (can be overridden via .env file)
      - MINIPAM_CONFIG_FILE=${MINIPAM_CONFIG_FILE:-/app/config.apikey.yaml}
      
      # Optional: Enable debug mode (uncomment for development)
      # - MINIPAM_DEBUG=true
      
      # Production overrides (override config file values if needed)
      # Uncomment and set for production deployments:
      # - MINIPAM_JWT_SECRET=your-production-jwt-secret-here
      # 
      # For API key authentication, set API keys:
      # - MINIPAM_API_KEY_ADMIN=sk-minipam-admin-production-key:readwrite
      # - MINIPAM_API_KEY_VIEWER=sk-minipam-viewer-production-key:readonly
      # - MINIPAM_API_KEY_SERVICE=sk-minipam-service-production-key:readwrite
      # 
      # For Azure authentication, set Azure credentials:
      # - MINIPAM_OIDC_CLIENT_ID=your-azure-app-client-id
      # - MINIPAM_OIDC_CLIENT_SECRET=your-azure-app-client-secret
      # - MINIPAM_OIDC_ISSUER_URL=https://login.microsoftonline.com/your-tenant-id/v2.0
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  minipam-data:
    driver: local

# =============================================================================
# Example .env file configurations:
# =============================================================================
#
# For API Key Authentication (.env):
# MINIPAM_CONFIG_FILE=/app/config.apikey.yaml
# MINIPAM_JWT_SECRET=your-production-jwt-secret
# MINIPAM_API_KEY_ADMIN=sk-admin-prod-xyz:readwrite
# MINIPAM_API_KEY_VIEWER=sk-viewer-prod-abc:readonly
#
# For Azure Entra ID Authentication (.env):
# MINIPAM_CONFIG_FILE=/app/config.azure.yaml
# MINIPAM_JWT_SECRET=your-production-jwt-secret
# MINIPAM_OIDC_CLIENT_ID=12345678-1234-1234-1234-123456789abc
# MINIPAM_OIDC_CLIENT_SECRET=your~client~secret~here
# MINIPAM_OIDC_ISSUER_URL=https://login.microsoftonline.com/your-tenant-id/v2.0
#
# =============================================================================
# Authentication Testing Commands:
# =============================================================================
#
# API Key Authentication:
# 1. Login: curl -X POST "http://localhost:8000/auth/login/apikey?api_key=sk-minipam-admin-12345"
# 2. Use token: curl -H "Authorization: Bearer <token>" http://localhost:8000/api/cidrs
#
# Azure Entra ID Authentication:
# 1. Start login: curl http://localhost:8000/auth/login/oidc (redirects to Microsoft)
# 2. Complete login in browser
# 3. Use returned JWT token for API access
