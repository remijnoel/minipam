# Docker Compose configuration for MiniPAM
#
# Usage:
#   Default (no auth):     docker-compose up -d
#   With Azure OIDC:       docker-compose --env-file .env.azure up -d
#   With API Keys:         docker-compose --env-file .env.apikey up -d

version: '3.8'

services:
  minipam:
    build: 
      context: .
      target: production
    container_name: minipam
    ports:
      - "${MINIPAM_PORT:-8000}:8000"
    environment:
      # Server configuration
      - MINIPAM_SERVER_HOST=0.0.0.0
      - MINIPAM_SERVER_PORT=8000
      - MINIPAM_SERVER_DEBUG=${MINIPAM_DEBUG:-false}
      
      # Storage configuration
      - MINIPAM_STORAGE_TYPE=${MINIPAM_STORAGE_TYPE:-file}
      - MINIPAM_STORAGE_PATH=/app/data
      
      # Authentication configuration
      # Default: no authentication (for development)
      - MINIPAM_AUTH_BACKEND=${MINIPAM_AUTH_BACKEND:-none}
      - ENABLE_NOAUTH=${ENABLE_NOAUTH:-true}
      
      # API Key authentication (set MINIPAM_AUTH_BACKEND=apikey)
      - MINIPAM_AUTH_APIKEY_KEYS=${MINIPAM_AUTH_APIKEY_KEYS:-}
      
      # OIDC authentication (set MINIPAM_AUTH_BACKEND=oidc)
      - MINIPAM_AUTH_OIDC_ISSUER_URL=${MINIPAM_AUTH_OIDC_ISSUER_URL:-}
      - MINIPAM_AUTH_OIDC_CLIENT_ID=${MINIPAM_AUTH_OIDC_CLIENT_ID:-}
      - MINIPAM_AUTH_OIDC_CLIENT_SECRET=${MINIPAM_AUTH_OIDC_CLIENT_SECRET:-}
      - MINIPAM_AUTH_OIDC_JWKS_CACHE_TTL=${MINIPAM_AUTH_OIDC_JWKS_CACHE_TTL:-300}
      
      # UI configuration
      - MINIPAM_UI_ENABLED=${MINIPAM_UI_ENABLED:-true}
      - MINIPAM_UI_PATH=${MINIPAM_UI_PATH:-/}
      
    volumes:
      - minipam-data:/app/data
      # Optional: Mount custom config file
      # - ./config.yaml:/etc/minipam/config.yaml:ro
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - minipam-network

volumes:
  minipam-data:
    driver: local

networks:
  minipam-network:
    driver: bridge

# Example .env.azure file:
# MINIPAM_AUTH_BACKEND=oidc
# ENABLE_NOAUTH=false
# MINIPAM_AUTH_OIDC_ISSUER_URL=https://login.microsoftonline.com/YOUR_TENANT_ID/v2.0
# MINIPAM_AUTH_OIDC_CLIENT_ID=your-client-id
# MINIPAM_AUTH_OIDC_CLIENT_SECRET=your-client-secret

# Example .env.apikey file:
# MINIPAM_AUTH_BACKEND=apikey
# ENABLE_NOAUTH=false
# MINIPAM_AUTH_APIKEY_KEYS=key1,key2,key3