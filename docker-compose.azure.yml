# Docker Compose Override for Azure Entra ID Authentication
#
# This file provides an alternative configuration for Azure Entra ID (OIDC) authentication.
# Use this instead of API key authentication for enterprise SSO integration.
#
# Usage:
# 1. Configure your Azure Entra ID application (see setup instructions below)
# 2. Update the environment variables with your Azure tenant details
# 3. Start with: docker-compose -f docker-compose.yml -f docker-compose.azure.yml up -d
#
# Azure Entra ID Setup Instructions:
# 1. Go to Azure Portal (portal.azure.com) → Azure Active Directory
# 2. Navigate to App registrations → New registration
# 3. Application details:
#    - Name: MiniPAM CIDR Management
#    - Supported account types: Accounts in this organizational directory only
#    - Redirect URI: Web → http://localhost:8000/auth/callback/oidc
# 4. After registration, note the Application (client) ID and Directory (tenant) ID
# 5. Go to Certificates & secrets → New client secret → Copy the secret value
# 6. Go to API permissions → Add a permission → Microsoft Graph:
#    - User.Read (Delegated) - to read user profile
#    - GroupMember.Read.All (Application, optional) - to read group memberships
# 7. Create Azure AD Security Groups for role mapping:
#    - minipam-admins (for readwrite access)
#    - minipam-users (for readonly access)
# 8. Assign users to appropriate groups
# 9. Update the environment variables below with your values

services:
  minipam:
    environment:
      # Override authentication backend to use OIDC
      - MINIPAM_AUTH_BACKEND=oidc
      
      # JWT configuration (keep the same secret for consistency)
      - MINIPAM_JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - MINIPAM_JWT_ALGORITHM=HS256
      - MINIPAM_JWT_EXPIRY_HOURS=8
      
      # Azure Entra ID OIDC Configuration
      # Replace these values with your Azure application details:
      - MINIPAM_OIDC_CLIENT_ID=your-azure-app-client-id-here
      - MINIPAM_OIDC_CLIENT_SECRET=your-azure-app-client-secret-here
      - MINIPAM_OIDC_ISSUER_URL=https://login.microsoftonline.com/your-tenant-id-here/v2.0
      - MINIPAM_OIDC_REDIRECT_URI=http://localhost:8000/auth/callback/oidc
      - MINIPAM_OIDC_SCOPE=openid profile email
      
      # Role mapping configuration
      # Maps Azure AD groups to MiniPAM roles
      - MINIPAM_OIDC_ROLE_CLAIM=groups
      - MINIPAM_OIDC_ROLE_MAPPING=minipam-admins:readwrite,minipam-users:readonly
      - MINIPAM_OIDC_DEFAULT_ROLE=readonly
      
      # Optional: Enable debug mode to troubleshoot OIDC flow
      # - MINIPAM_DEBUG=true

# Example .env file for Azure Entra ID:
# Create a .env file with your actual Azure values:
#
# MINIPAM_OIDC_CLIENT_ID=12345678-1234-1234-1234-123456789abc
# MINIPAM_OIDC_CLIENT_SECRET=your~secret~value~here
# MINIPAM_OIDC_ISSUER_URL=https://login.microsoftonline.com/87654321-4321-4321-4321-cba987654321/v2.0
# MINIPAM_JWT_SECRET=your-production-jwt-secret-here
#
# Authentication Flow:
# 1. User visits http://localhost:8000/auth/login/oidc
# 2. Redirected to Microsoft login page
# 3. After successful login, redirected back to MiniPAM
# 4. MiniPAM validates the token and creates a JWT
# 5. User can access protected APIs with the JWT token
#
# Testing OIDC Authentication:
# 1. Start: docker-compose -f docker-compose.yml -f docker-compose.azure.yml up -d
# 2. Check config: curl http://localhost:8000/auth/config
# 3. Start login: curl http://localhost:8000/auth/login/oidc (will redirect to Microsoft)
# 4. Complete login flow in browser
# 5. Use returned JWT token for API access
