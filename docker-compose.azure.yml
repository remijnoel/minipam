# Docker Compose configuration for MiniPAM with Azure OIDC

version: '3.8'

services:
  minipam:
    build: 
      context: .
      target: production
    container_name: minipam-azure
    ports:
      - "8000:8000"
    environment:
      - MINIPAM_STORAGE_TYPE=file
      - MINIPAM_STORAGE_PATH=/app/data
      - MINIPAM_AUTH_BACKEND=oidc
      - MINIPAM_AUTH_OIDC_ISSUER_URL=${AZURE_ISSUER_URL}
      - MINIPAM_AUTH_OIDC_CLIENT_ID=${AZURE_CLIENT_ID}
      - MINIPAM_AUTH_OIDC_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - MINIPAM_SERVER_HOST=0.0.0.0
      - MINIPAM_SERVER_PORT=8000
      - MINIPAM_UI_ENABLED=true
    volumes:
      - minipam-data:/app/data
      - ./config.azure.yaml:/etc/minipam/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - minipam-network

volumes:
  minipam-data:
    driver: local

networks:
  minipam-network:
    driver: bridge